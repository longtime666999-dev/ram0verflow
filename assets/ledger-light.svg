<text x="18" y="26" fill="#121916" font-size="15" font-weight="700">ROFL</text><text x="72" y="26" fill="#68746e" font-size="12.5">height 3711 &#183; difficulty 1 &#183; 1 puzzles per block</text><rect x="18" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="29" y="65" fill="#8a5f10" font-size="13" font-weight="700">#3706</text><text x="29" y="81" fill="#121916" font-size="10">c0d681fcd8e5ffe8&#8230;</text><text x="29" y="96" fill="#1c5b52" font-size="10.5">@ywltby</text><text x="29" y="110" fill="#68746e" font-size="9">排位，比世界赛决赛还难打。</text><line x1="166" y1="82.0" x2="192" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="192" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="203" y="65" fill="#8a5f10" font-size="13" font-weight="700">#3707</text><text x="203" y="81" fill="#121916" font-size="10">af8984851d8123d3&#8230;</text><text x="203" y="96" fill="#1c5b52" font-size="10.5">@ywltby</text><text x="203" y="110" fill="#68746e" font-size="9">输你一场，不代表我们会一直输给你。</text><line x1="340" y1="82.0" x2="366" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="366" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="377" y="65" fill="#8a5f10" font-size="13" font-weight="700">#3708</text><text x="377" y="81" fill="#121916" font-size="10">ef7694c650fc0e9d&#8230;</text><text x="377" y="96" fill="#1c5b52" font-size="10.5">@ywltby</text><text x="377" y="110" fill="#68746e" font-size="9">天不生我ZmjjKK，瓦圈万古如长夜。</text><line x1="514" y1="82.0" x2="540" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="540" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="551" y="65" fill="#8a5f10" font-size="13" font-weight="700">#3709</text><text x="551" y="81" fill="#121916" font-size="10">1d4132a7427567a2&#8230;</text><text x="551" y="96" fill="#1c5b52" font-size="10.5">@ywltby</text><text x="551" y="110" fill="#68746e" font-size="9">现在拿了世界冠军还在骂我，那拿了世界冠军有&#8230;</text><line x1="688" y1="82.0" x2="714" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="714" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="725" y="65" fill="#8a5f10" font-size="13" font-weight="700">#3710</text><text x="725" y="81" fill="#121916" font-size="10">645dd0a84e5f1d5f&#8230;</text><text x="725" y="96" fill="#1c5b52" font-size="10.5">@ywltby</text><text x="725" y="110" fill="#68746e" font-size="9">以前说拿了世界冠军就不骂我了，</text><line x1="862" y1="82.0" x2="888" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="888" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="899" y="65" fill="#8a5f10" font-size="13" font-weight="700">#3711</text><text x="899" y="81" fill="#121916" font-size="10">00f0faab9dd85c7a&#8230;</text><text x="899" y="96" fill="#1c5b52" font-size="10.5">@ywltby</text><text x="899" y="110" fill="#68746e" font-size="9">T1我们明天就把你送回家。</text></svg>
